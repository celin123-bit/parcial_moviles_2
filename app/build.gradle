plugins { id 'com.android.application' }

def localConfig = new Properties()
if (rootProject.file('local.properties').exists()) {
    rootProject.file('local.properties').withInputStream { localConfig.load(it) }
}
def mapsKey = localConfig.getProperty('MAPS_API_KEY', System.getenv('MAPS_API_KEY') ?: '')
if (mapsKey == 'PEGA_TU_API_KEY_AQUI') mapsKey = ''

android {
    namespace 'pe.edu.moivo'
    compileSdk 35
    defaultConfig {
        applicationId 'pe.edu.moivo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [MAPS_API_KEY: mapsKey]
        buildConfigField 'boolean', 'MAPS_CONFIGURED', "${!mapsKey.isBlank()}"
        javaCompileOptions {
            annotationProcessorOptions { arguments += ['room.schemaLocation': "$projectDir/schemas".toString()] }
        }
    }
    buildFeatures { viewBinding true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.includeAndroidResources = true }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment:1.8.6'
    implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.room:room-runtime:2.7.2'
    annotationProcessor 'androidx.room:room-compiler:2.7.2'
    implementation 'com.google.android.gms:play-services-maps:19.2.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
